<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}img{max-width:100%}</style>
<title>Trib3 Slide Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F7ECEE;          /* blush */
  --surface:#FFFBFB;
  --surface-2:#F0DDE2;
  --ink:#1A1717;         /* matches the logo */
  --muted:#6B5A60;
  --line:#E6CFD6;
  --shadow:0 1px 0 rgba(26,23,23,.06), 0 14px 30px -18px rgba(91,42,110,.45);
  --hibiscus:#B8325A; --hibiscus-fg:#FFFFFF;
  --plum:#5B2A6E;     --plum-fg:#FFFFFF;
  --marigold:#F2A541; --marigold-fg:#2A1A05;
  --sage:#2F6F62;     --sage-fg:#FFFFFF;
  --lilac:#C3B1EC;    --lilac-fg:#241A3D;
  --wild:#1A1717;     --wild-fg:#F7ECEE;
  --taken:#EFE3E6; --taken-fg:#8A7880;
  --danger:#B42343;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 72px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:12px}
.brand h1{margin:0;line-height:0}
.brand .logo{width:clamp(220px,36vw,400px);height:auto;color:var(--ink);display:block}
.brand .event{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,30px);letter-spacing:-.01em;margin:0;color:var(--plum);font-variation-settings:"opsz" 96}
.brand p{margin:0;color:var(--muted);max-width:52ch;font-size:16px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 18px;border-radius:999px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--marigold);color:var(--marigold-fg);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}
.banner code{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:6px}

/* Pick view */
.pick-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.pick-grid{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){
  .side{position:static}
  /* phones: name box, then the topics, then stats and suggestions */
  .pick-grid{display:flex;flex-direction:column}
  .side{display:contents}
  #meBox{order:1}
  .board-col{order:2}
  .side > .box:not(#meBox){order:3}
}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.label{font-size:14px;font-weight:700;color:var(--muted)}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px}
.field input:focus{border-color:var(--plum);outline:none}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:var(--surface-2);color:var(--ink);transition:transform .1s ease, filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pink{background:var(--hibiscus);color:var(--hibiscus-fg)}
.btn.blue{background:var(--plum);color:var(--plum-fg)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.surprise{font-size:17px;padding:14px 16px;border-radius:14px;background:var(--plum);color:var(--plum-fg)}
.hint{margin:0;font-size:13px;color:var(--muted)}

.ticket{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.ticket .t{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;overflow-wrap:anywhere;text-wrap:balance}
.ticket .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.ticket::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}

.stats{display:flex;align-items:baseline;gap:8px}
.stats b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}

.board-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fchip .dot{width:10px;height:10px;border-radius:50%}
.fchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{appearance:none;border:0;text-align:left;border-radius:22px;padding:18px 18px 16px;min-height:190px;display:flex;flex-direction:column;gap:10px;justify-content:space-between;background:var(--c);color:var(--cfg);box-shadow:var(--shadow);position:relative;transition:transform .15s ease, box-shadow .15s}
.card:not(.taken):hover{transform:translateY(-3px) rotate(-.6deg)}
.card .cat{font-size:14px;font-weight:700;opacity:.9}
.card .t{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.15;font-variation-settings:"opsz" 48;overflow-wrap:anywhere;text-wrap:balance}
.card .foot{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.taken{background:var(--taken);color:var(--taken-fg);cursor:default;box-shadow:none}
.card.taken .t{text-decoration:line-through;text-decoration-thickness:2px}
.card.taken .who{background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.mine{background:var(--c);color:var(--cfg);outline:4px solid var(--ink);outline-offset:3px}
.card.mine .t{text-decoration:none}
.card.fresh{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.92)}100%{transform:scale(1)}}
.confirm{display:flex;flex-direction:column;gap:8px}
.confirm .q{font-weight:800}
.confirm .row{display:flex;gap:6px;flex-wrap:wrap}
.confirm .btn{background:var(--surface);color:var(--ink)}
.confirm .btn.go{background:var(--ink);color:var(--bg)}
.empty{grid-column:1/-1;background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}

.suggest select{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 10px}

/* Showtime */
.show-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.show-grid{grid-template-columns:minmax(0,1fr)}}
.spot{border-radius:26px;padding:24px;background:var(--c,var(--plum));color:var(--cfg,#fff);display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:300px}
.spot::before,.spot::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.spot::before{width:240px;height:240px;right:-70px;bottom:-90px}
.spot::after{width:90px;height:90px;right:120px;top:-30px}
.spot .eyebrow{font-size:15px;font-weight:700;opacity:.9}
.spot .name{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(40px,7vw,72px);line-height:.95;overflow-wrap:anywhere;position:relative}
.spot .topic{font-size:clamp(18px,2.4vw,24px);font-weight:700;max-width:30ch;text-wrap:balance;position:relative}
.spot .spot-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;position:relative;margin-top:auto}
.spot .btn{background:rgba(255,255,255,.94);color:var(--ink)}
.spot .btn.solid{background:var(--ink);color:#fff}
.rolling .name{filter:blur(.4px)}

.timer{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.28)}
.ring .prog{stroke:currentColor;transition:stroke-dashoffset 1s linear}
.ring .clock{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.ring.low .clock{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tctrls{display:flex;flex-direction:column;gap:8px}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.presets button{border:0;border-radius:8px;padding:4px 9px;font-weight:800;font-size:12px;background:rgba(255,255,255,.2);color:inherit}
.presets button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--ink)}

.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.order li button{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;text-align:left;background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border-left:6px solid var(--c)}
.order li.done button{opacity:.5}
.order li.now button{outline:3px solid var(--ink)}
.order .n{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.order .nm{font-weight:800}
.order .tp{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.order .st{font-size:13px;font-weight:700;color:var(--muted)}
.order-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,1.4,.4,1);z-index:10}
.toast.on{transform:translate(-50%,0);visibility:visible}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

  <section id="viewPick">
    <div class="pick-grid">
      <aside class="side">

        <div class="box">
          <div class="label">Topics taken</div>

            </div>

/* ─── small helpers ─── */
const $ = id => document.getElementById(id);

  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === "x" ? r : (r&3|8)).toString(16); }));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ─── backends ─── */
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);

function liveApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data || {}; };
  return {
    async list(){
      const { data, error } = await sb.from(CONFIG.TABLE).select("id,title,category,claimed_by,claimed_at,created_at").order("created_at", { ascending: true });
      if (error) throw error; return data;
    },
    claim: (id, name, token) => rpc(CONFIG.RPC + "claim_topic", { p_topic: id, p_name: name, p_token: token }),
    claimRandom: (name, token) => rpc(CONFIG.RPC + "claim_random_topic", { p_name: name, p_token: token }),
    release: token => rpc(CONFIG.RPC + "release_topic", { p_token: token }),
    add: (title, category) => rpc(CONFIG.RPC + "add_topic", { p_title: title, p_category: category }),
    subscribe(cb){
      sb.channel("trib3-topics-live").on("postgres_changes", { event: "*", schema: "public", table: CONFIG.TABLE }, cb).subscribe();
      setInterval(cb, 15000);
    }
  };
}

function demoApi(){
  const KEY = "t3.demo.v1";
  let db = store.get(KEY, null);
  if (!db){
    const t0 = Date.now() - 3600e3;
    const topics = SEED.map(([title, category], i) => ({ id: "d" + i, title, category, claimed_by: null, claimed_at: null, created_at: new Date(t0 + i).toISOString() }));
    [["Ada",2],["Tobi",0]].forEach(([n,i],k) => { topics[i].claimed_by = n; topics[i].claimed_at = new Date(t0 + 60e3*(k+1)).toISOString(); });
    db = { topics, tokens: {} };
  }
  const save = () => store.set(KEY, db);
  const ok = id => ({ status: "ok", topic_id: id });
  return {
    async list(){ return db.topics.map(t => ({...t})); },
    async claim(id, name, token){
      if (Object.values(db.tokens).includes(token)) return { status: "already_have_one" };
      const t = db.topics.find(x => x.id === id);
      if (!t || t.claimed_by) return { status: "taken" };
      t.claimed_by = name; t.claimed_at = new Date().toISOString(); db.tokens[id] = token; save(); return ok(id);
    },
    async claimRandom(name, token){
      if (Object.values(db.tokens).includes(token)) return { status: "already_have_one" };
      const free = db.topics.filter(t => !t.claimed_by);
      if (!free.length) return { status: "none_left" };
      return this.claim(free[Math.floor(Math.random()*free.length)].id, name, token);
    },
    async release(token){
      const id = Object.keys(db.tokens).find(k => db.tokens[k] === token);
      if (!id) return { status: "not_found" };
      const t = db.topics.find(x => x.id === id); t.claimed_by = null; t.claimed_at = null; delete db.tokens[id]; save(); return { status: "ok" };
    },
    async add(title, category){
      if (db.topics.some(t => t.title.trim().toLowerCase() === title.trim().toLowerCase())) return { status: "duplicate" };
      db.topics.push({ id: "u" + Date.now(), title, category, claimed_by: null, claimed_at: null, created_at: new Date().toISOString() }); save(); return { status: "ok" };
    },
    subscribe(){}
  };
}

const api = LIVE ? liveApi() : demoApi();

/* ─── state ─── */
let topics = [];
let me = store.get("t3.me", null) || { name: "", token: uuid() };
store.set("t3.me", me);
let filter = "All";
let pendingId = null;
let freshId = null;
let busy = false;
const show = store.get("t3.show.v1", { order: null, done: [], current: null, minutes: 10 });
const saveShow = () => store.set("t3.show.v1", show);

const myTopic = () => me.topicId ? topics.find(t => t.id === me.topicId && t.claimed_by) : null;

/* ─── data refresh ─── */
let refreshing = false, again = false;
async function refresh(){
  if (refreshing){ again = true; return; }
  refreshing = true;
  try {
    topics = await api.list();
    if (me.topicId && !topics.some(t => t.id === me.topicId && t.claimed_by)){ delete me.topicId; store.set("t3.me", me); }
    render();
  } catch(e){
    showBanner(`Couldn't reach the topic board. Check your connection, then refresh the page.`);
  } finally {
    refreshing = false;
    if (again){ again = false; refresh(); }
  }
}

/* ─── render: pick ─── */
let meKey = null;
function renderMe(){
  const mine = myTopic();
  const key = mine ? `${mine.id}|${mine.claimed_by}|${mine.title}` : "none";
  if (key === meKey) return;
  meKey = key;

      <p class="hint">Tap a topic card to claim it. First come, first served.</p>

function renderStats(){
  const taken = topics.filter(t => t.claimed_by).length;
  $("takenN").textContent = taken;
  $("takenOf").textContent = `of ${topics.length} · ${topics.length - taken} still free`;

}

function renderFilters(){
  const present = [...new Set(topics.map(t => t.category))];
  const crowded = present.some(k => topics.filter(t => t.category === k).length > 1);
  $("filters").hidden = !crowded;
  if (!crowded && filter !== "All") filter = "All";
  const order = Object.keys(CATS).filter(k => present.includes(k)).concat(present.filter(k => !CATS[k]));
  $("filters").innerHTML = ["All", ...order].map(k => `<button class="fchip" data-filter="${esc(k)}" aria-pressed="${filter===k}">${k==="All"?"":`<span class="dot" style="background:${cat(k).c}"></span>`}${esc(k)}</button>`).join("");
  $("sCat").innerHTML = Object.keys(CATS).map(k => `<option ${k==="Wildcard"?"selected":""}>${esc(k)}</option>`).join("");
}

function renderBoard(){
  const hide = $("hideTaken").checked;
  const mineId = myTopic()?.id;
  const list = topics.filter(t => (filter === "All" || t.category === filter) && (!hide || !t.claimed_by || t.id === mineId));
  if (!list.length){ $("board").innerHTML = `<div class="empty">${hide ? "Every topic here is taken. Untick “Hide taken” to see who has what, or suggest a new one." : "No topics in this category yet."}</div>`; return; }
  $("board").innerHTML = list.map(t => {
    const c = cat(t.category);
    const mine = t.id === mineId;
    const cls = ["card", t.claimed_by && !mine ? "taken" : "", mine ? "mine" : "", t.id === freshId ? "fresh" : ""].join(" ");
    const style = `--c:${c.c};--cfg:${c.fg}`;
    if (t.id === pendingId && !t.claimed_by){
      return `<div class="${cls}" style="${style}">
        <span class="cat">${esc(t.category)}</span>
        <span class="t">${esc(t.title)}</span>
        <div class="confirm"><span class="q">Claim this as ${esc(me.name.trim())}?</span>
          <div class="row"><button class="btn small go" data-claim="${esc(t.id)}">Yes, it's mine</button><button class="btn small" data-cancel="1">Cancel</button></div></div>
      </div>`;
    }
    const foot = t.claimed_by
      ? `<span class="who">${mine ? "Yours" : esc(t.claimed_by)}</span>`
      : `<span>Claim it</span><span aria-hidden="true">→</span>`;
    return `<button class="${cls}" style="${style}" ${t.claimed_by ? 'aria-disabled="true" tabindex="-1"' : `data-pick="${esc(t.id)}"`}>
      <span class="cat">${esc(t.category)}</span><span class="t">${esc(t.title)}</span><span class="foot">${foot}</span></button>`;
  }).join("");
  freshId = null;
}

/* ─── render: showtime ─── */
function lineup(){
  const claimed = topics.filter(t => t.claimed_by).sort((a,b) => (a.claimed_at||"").localeCompare(b.claimed_at||""));
  if (show.order){
    const pos = new Map(show.order.map((id,i) => [id,i]));
    claimed.sort((a,b) => (pos.has(a.id)?pos.get(a.id):1e6) - (pos.has(b.id)?pos.get(b.id):1e6));
  }
  return claimed;
}
function renderShow(){
  const list = lineup();
  const cur = list.find(t => t.id === show.current);
  $("order").innerHTML = list.length ? list.map((t,i) => {
    const done = show.done.includes(t.id);
    return `<li class="${done?"done":""} ${t.id===show.current?"now":""}" style="--c:${cat(t.category).c}">
      <button data-stage="${esc(t.id)}"><span class="n">${String(i+1).padStart(2,"0")}</span>
      <span><span class="nm">${esc(t.claimed_by)}</span><br><span class="tp">${esc(t.title)}</span></span>
      <span class="st">${t.id===show.current?"On stage":done?"Done":""}</span></button></li>`;
  }).join("") : `<li class="empty">Nobody has claimed a topic yet. Share the link and watch this fill up.</li>`;
  const spot = $("spot");
  if (cur && !rolling){
    const c = cat(cur.category);
    spot.style.setProperty("--c", c.c); spot.style.setProperty("--cfg", c.fg);
    $("spotEyebrow").textContent = "Now presenting";
    $("spotName").textContent = cur.claimed_by;
    $("spotTopic").textContent = cur.title;
  } else if (!rolling){
    spot.style.removeProperty("--c"); spot.style.removeProperty("--cfg");
    const left = list.filter(t => !show.done.includes(t.id)).length;
    $("spotEyebrow").textContent = left ? `${left} ${left===1?"talk":"talks"} to go` : list.length ? "That's a wrap" : "Waiting for picks";
    $("spotName").textContent = left ? "Who's next?" : list.length ? "Great show!" : "Nobody yet";
    $("spotTopic").textContent = left ? "Tap Spin for next, or pick someone from the running order." : list.length ? "Every talk is done. Thanks for sharing, everyone." : "Once people claim topics, they appear here.";
  }
  $("spinBtn").disabled = !list.some(t => !show.done.includes(t.id) && t.id !== show.current);
  $("doneBtn").disabled = !cur;
  document.querySelectorAll("#presets button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.min === show.minutes)));
}

function render(){ renderMe(); renderStats(); renderFilters(); renderBoard(); renderShow(); }

/* ─── actions ─── */
function needName(){
  const n = (me.name||"").trim();
  if (!n){ toast("Add your name first"); $("nameInput")?.focus(); return null; }
  return n;
}
async function claim(id){
  const name = needName(); if (!name || busy) return;
  busy = true;
  try{
    const r = await api.claim(id, name, me.token);
    handleClaim(r, id);
  }catch(e){ toast("That didn't go through. Try again."); }
  finally{ busy = false; pendingId = null; refresh(); }
}
async function surprise(){
  const name = needName(); if (!name || busy) return;
  busy = true;
  try{
    const r = await api.claimRandom(name, me.token);
    handleClaim(r, r.topic_id);
  }catch(e){ toast("That didn't go through. Try again."); }
  finally{ busy = false; refresh(); }
}
function handleClaim(r, id){
  const s = r && r.status;
  if (s === "ok"){ me.topicId = r.topic_id || id; store.set("t3.me", me); freshId = me.topicId; burst(); toast("It's yours! Start on those slides."); }
  else if (s === "taken") toast("Too slow! Someone just grabbed that one.");
  else if (s === "already_have_one") toast("You already have a topic. Swap it first.");
  else if (s === "none_left") toast("Every topic is taken. Suggest a new one in the box on the left.");
  else if (s === "bad_name") toast("Names need 1 to 40 characters.");
  else toast("That didn't go through. Try again.");
}
async function release(){
  if (busy) return; busy = true;
  try{ await api.release(me.token); delete me.topicId; store.set("t3.me", me); toast("Topic released. Pick another!"); }
  catch(e){ toast("Couldn't release it. Try again."); }
  finally{ busy = false; refresh(); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.pick){
    if (myTopic()){ toast("You already have a topic. Swap it first."); return; }
    if (!needName()) return;
    pendingId = b.dataset.pick; renderBoard();
    document.querySelector("[data-claim]")?.focus(); return;
  }
  if (b.dataset.claim){ claim(b.dataset.claim); return; }
  if (b.dataset.cancel){ pendingId = null; renderBoard(); return; }
  if (b.dataset.filter){ filter = b.dataset.filter; pendingId = null; renderFilters(); renderBoard(); return; }
  if (b.dataset.stage){ show.current = b.dataset.stage; saveShow(); resetClock(); renderShow(); return; }
  if (b.dataset.min){ show.minutes = +b.dataset.min; saveShow(); resetClock(); renderShow(); return; }
  switch(b.id){
    case "surpriseBtn": surprise(); break;
    case "releaseBtn": release(); break;
    case "tabPick": setTab("pick"); break;
    case "tabShow": setTab("show"); break;
    case "startBtn": toggleClock(); break;
    case "resetBtn": resetClock(); break;
    case "spinBtn": spin(); break;
    case "doneBtn":
      if (show.current && !show.done.includes(show.current)) show.done.push(show.current);
      show.current = null; saveShow(); resetClock(); burst(); renderShow(); break;
    case "shuffleBtn": show.order = shuffle(lineup().map(t => t.id)); saveShow(); renderShow(); toast("Running order shuffled"); break;
    case "clearDoneBtn": show.done = []; show.current = null; saveShow(); resetClock(); renderShow(); break;
  }
});
$("hideTaken").addEventListener("change", renderBoard);
$("suggestForm").addEventListener("submit", async e => {
  e.preventDefault();
  const title = $("sTitle").value.trim();
  if (title.length < 3){ toast("Topics need at least 3 characters"); return; }
  try{
    const r = await api.add(title, $("sCat").value);
    if (r.status === "ok"){ $("sTitle").value = ""; toast("Topic added to the board"); refresh(); }
    else if (r.status === "duplicate") toast("That topic is already on the board");
    else if (r.status === "full") toast("The board is full. Ask the host to clear some topics.");
    else toast("Topics need 3 to 160 characters");
  }catch(err){ toast("Couldn't add it. Try again."); }
});

/* ─── tabs ─── */
function setTab(t){
  $("viewPick").hidden = t !== "pick"; $("viewShow").hidden = t !== "show";
  $("tabPick").setAttribute("aria-selected", String(t === "pick"));
  $("tabShow").setAttribute("aria-selected", String(t === "show"));
  try{ history.replaceState(null, "", t === "show" ? "#showtime" : "#pick"); }catch(e){}
}

/* ─── spin ─── */
let rolling = false;
function spin(){
  const pool = lineup().filter(t => !show.done.includes(t.id) && t.id !== show.current);
  if (!pool.length || rolling) return;
  const winner = pool[Math.floor(Math.random()*pool.length)];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  rolling = true; $("spot").classList.add("rolling");
  $("spotEyebrow").textContent = "Spinning…";
  let i = 0, delay = 60;
  const step = () => {
    const t = pool[i++ % pool.length], c = cat(t.category);
    $("spot").style.setProperty("--c", c.c); $("spot").style.setProperty("--cfg", c.fg);
    $("spotName").textContent = t.claimed_by; $("spotTopic").textContent = t.title;
    delay *= 1.12;
    if (delay < 420 && !reduce) setTimeout(step, delay);
    else { rolling = false; $("spot").classList.remove("rolling"); show.current = winner.id; saveShow(); resetClock(); renderShow(); burst(); }
  };
  step();
}

/* ─── timer ─── */
const CIRC = 326.73;
let left = 0, total = 0, tick = null;
function paintClock(){
  $("clock").textContent = `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
  $("prog").style.strokeDashoffset = String(CIRC * (1 - left/Math.max(1,total)));
  $("ring").classList.toggle("low", left <= 10 && left > 0 && !!tick);
  $("startBtn").textContent = tick ? "Pause" : (left > 0 && left < total ? "Resume" : "Start");
}
function resetClock(){ clearInterval(tick); tick = null; total = left = show.minutes * 60; paintClock(); }
function toggleClock(){
  if (tick){ clearInterval(tick); tick = null; paintClock(); return; }
  if (left <= 0) left = total;
  tick = setInterval(() => {
    left--;
    if (left <= 0){ left = 0; clearInterval(tick); tick = null; ding(); burst(); toast("Time's up! Wrap it up."); }
    paintClock();
  }, 1000);
  paintClock();
}
function ding(){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => {
      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i*0.12;
      o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.4);
      o.start(t); o.stop(t+0.45);
    });
  }catch(e){}
}

/* ─── confetti ─── */
const cv = $("confetti"), cx = cv.getContext("2d");
let bits = [], raf = null;
function burst(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cols = Object.values(CATS).map(c => c.raw);
  for (let i = 0; i < 140; i++){
    bits.push({ x: innerWidth/2 + (Math.random()-.5)*120, y: innerHeight*0.35, vx: (Math.random()-.5)*14, vy: -Math.random()*12-4,
      w: 6+Math.random()*6, h: 8+Math.random()*8, r: Math.random()*6, vr: (Math.random()-.5)*0.4, c: cols[i % cols.length], life: 0 });
  }
  if (!raf) raf = requestAnimationFrame(frame);
}
function frame(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  bits = bits.filter(b => b.y < innerHeight + 40 && b.life < 260);
  for (const b of bits){
    b.vy += 0.32; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr; b.life++;
    cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c; cx.fillRect(-b.w/2, -b.h/2, b.w, b.h*Math.abs(Math.cos(b.r))); cx.restore();
  }
  raf = bits.length ? requestAnimationFrame(frame) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}

function showBanner(html){ $("banner").innerHTML = html; $("banner").hidden = false; }

  showBanner(`<span>Demo mode: picks save on this device only, and Ada and Tobi are example players.</span><span>Add your Supabase URL and key in <code>CONFIG</code> to share it with everyone.</span>`);

setTab(location.hash === "#showtime" ? "show" : "pick");
resetClock();
refresh();
api.subscribe(() => refresh());
</script>
